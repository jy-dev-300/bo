[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-search-rag"
version = "0.1.0"
description = "Local-first personal search and grounded RAG learning project"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chonkie[semantic]>=1.7,<2",
  "fastapi>=0.115,<1",
  "FlagEmbedding>=1.4.2,<2",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "tree-sitter-language-pack>=1.20,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "ingestion", "retrieval", "rag", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
